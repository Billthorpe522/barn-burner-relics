<script type="application/json" id="bbr-config">{"embed":true,"imports":false}</script>
<script type="module">
const root=document.getElementById('bbr-complete-library');
const el=id=>document.getElementById('bbr-'+id);
const error=el('error');
const config=JSON.parse(el('config').textContent),LIMIT=64;
if(config.embed){root.dataset.embed='true';root.querySelectorAll('.viz-controls,.bbr-modes,details,.bbr-detail').forEach(x=>x.hidden=true);}
else el('import-controls').hidden=!config.imports;
try {
  const THREE=await import('https://esm.sh/three@0.170.0');
  const {OrbitControls}=await import('https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js');
  const {toCreasedNormals}=await import('https://esm.sh/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js');
  const library=JSON.parse(document.getElementById('bbr-model-data').textContent);
  const geometries=new Map();
  for(const m of library){
    const packed=Uint8Array.from(atob(m.packed),c=>c.charCodeAt(0));
    const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const raw=await new Response(stream).arrayBuffer();
    const bytes=new Uint8Array(raw);let cursor=0;
    function signed(){let n=0,s=0,b;do{b=bytes[cursor++];n|=(b&127)<<s;s+=7;}while(b&128);return (n>>>1)^-(n&1);}
    const vertices=new Float32Array(m.nv*3);
    const accum=[0,0,0];for(let i=0;i<vertices.length;i++){const d=i%3;accum[d]+=signed();vertices[i]=m.min[d]+accum[d]*(m.max[d]-m.min[d])/65535;}
    const indices=new Uint32Array(m.nf*3);let first=0;
    for(let i=0;i<indices.length;i+=3){first+=signed();indices[i]=first;indices[i+1]=first+signed();indices[i+2]=first+signed();}
    if(cursor!==bytes.length)throw Error('Geometry payload length mismatch: '+m.key);
    let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(vertices,3));g.setIndex(new THREE.BufferAttribute(indices,1));
    g.addGroup(0,indices.length,0);
    g=toCreasedNormals(g,Math.PI/5);g.computeBoundingBox();g.computeBoundingSphere();
    geometries.set(m.key,{meta:m,geometry:g});
  }
  for(const [kind,title] of [['relic','Relics'],['holder','Stands and cradles'],['reference','Form studies'],['accessory','Tools']]){
    const group=document.createElement('optgroup');group.label=title;
    for(const m of library.filter(x=>x.kind===kind)){const o=document.createElement('option');o.value=m.key;o.textContent=m.label;group.append(o);}
    el('library').append(group);
  }
  const canvas=el('canvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,.1,50000);camera.up.set(0,0,1);camera.position.set(210,-300,360);
  const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=false;orbit.minDistance=12;orbit.maxDistance=12000;
  orbit.enablePan=true;orbit.screenSpacePanning=true;
  const bodyMat=new THREE.MeshStandardMaterial({roughness:.53,metalness:.05});
  const artworkMat=new THREE.MeshStandardMaterial({roughness:.42,metalness:.35});
  const relicMat=new THREE.MeshStandardMaterial({roughness:.6,metalness:0});
  const ambient=new THREE.HemisphereLight();ambient.intensity=1.1;scene.add(ambient);
  const keyLight=new THREE.DirectionalLight();keyLight.intensity=2;keyLight.position.set(-180,-240,400);keyLight.castShadow=true;
  keyLight.shadow.mapSize.set(2048,2048);keyLight.shadow.camera.left=-360;keyLight.shadow.camera.right=360;keyLight.shadow.camera.top=360;keyLight.shadow.camera.bottom=-360;keyLight.shadow.camera.far=1400;keyLight.shadow.bias=-.0001;
  scene.add(keyLight);
  const fill=new THREE.DirectionalLight();fill.intensity=.7;fill.position.set(200,90,250);scene.add(fill);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.ShadowMaterial({opacity:.12}));ground.position.z=-.18;ground.receiveShadow=true;scene.add(ground);
  const grid=new THREE.GridHelper(4000,160);grid.rotation.x=Math.PI/2;grid.position.z=-.1;grid.material.vertexColors=false;grid.material.transparent=true;grid.material.opacity=.07;scene.add(grid);
  const selection=new THREE.Box3Helper(new THREE.Box3());selection.visible=false;selection.material.transparent=true;selection.material.opacity=.55;scene.add(selection);
  const instances=[];let selected=null,mode='view',serial=0,drag=null,clickStart=null,ready=false,lastSaved='';
  const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
  const stage=root.querySelector('.bbr-stage');let framePending=false;
  function draw(){framePending=false;ground.visible=camera.position.z>0;if(selected)selection.box.setFromObject(selected.mesh);renderer.render(scene,camera);}
  function schedule(){if(!framePending){framePending=true;requestAnimationFrame(draw);}}
  const cssProbe=document.createElement('span');cssProbe.hidden=true;root.append(cssProbe);
  const paletteCanvas=document.createElement('canvas');paletteCanvas.width=paletteCanvas.height=1;const paletteCtx=paletteCanvas.getContext('2d');
  function themeColor(token){cssProbe.style.color='var(--'+token+')';paletteCtx.fillStyle=getComputedStyle(cssProbe).color;paletteCtx.fillRect(0,0,1,1);const p=paletteCtx.getImageData(0,0,1,1).data;return new THREE.Color().setRGB(p[0]/255,p[1]/255,p[2]/255,THREE.SRGBColorSpace);}
  function updateTheme(){
    const fg=themeColor('foreground'),bg=themeColor('background');
    const light=fg.getHSL({}).l>bg.getHSL({}).l?fg:bg;
    const dark=fg.getHSL({}).l>bg.getHSL({}).l?bg:fg;
    bodyMat.color.copy(dark).lerp(light,.26);relicMat.color.copy(dark).lerp(light,.56);
    artworkMat.color.copy(themeColor('orange'));ambient.color.copy(light);ambient.groundColor.copy(bg);keyLight.color.copy(light);fill.color.copy(light);
    grid.material.color.copy(themeColor('muted-foreground'));selection.material.color.copy(themeColor('primary'));ground.material.color.copy(dark);
    schedule();
  }
  function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();if(ready)frame(instances);schedule();}
  new ResizeObserver(resize).observe(stage);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',updateTheme);
  function deg(v){return Math.round(THREE.MathUtils.radToDeg(v)*10)/10;}
  function value(v){return Math.round(v*10)/10;}
  function save(){
    if(!ready||config.embed||!window.openai?.setWidgetState)return;
    const snapshot={version:2,selectedId:selected?.id||null,models:instances.filter(i=>!i.meta.imported).map(i=>({id:i.id,key:i.key,position:i.mesh.position.toArray().map(value),rotation:i.mesh.rotation.toArray().slice(0,3).map(v=>Math.round(v*100000)/100000)}))};
    const state={modelContent:snapshot,privateContent:{mode,camera:camera.position.toArray(),target:orbit.target.toArray(),placementOpen:el('placement').open}};
    lastSaved=JSON.stringify(state);window.openai.setWidgetState(state).catch(()=>{});
  }
  function updateFields(announce=true){
    const active=!!selected;
    for(const id of ['inspect','flip','table','remove','x','y','z','rx','ry','rz'])el(id).disabled=!active;
    root.dataset.count=String(instances.length);el('add').disabled=instances.length>=LIMIT;
    el('related-controls').hidden=config.embed||!selected?.meta.related?.length;
    if(!active){el('detail').textContent='No piece selected';selection.visible=false;root.dataset.selected='';return;}
    el('selected').value=selected.id;
    el('related').replaceChildren();for(const key of selected.meta.related||[]){const o=document.createElement('option');o.value=key;o.textContent=geometries.get(key).meta.label;el('related').append(o);}
    const p=selected.mesh.position,r=selected.mesh.rotation;
    el('x').value=value(p.x);el('y').value=value(p.y);el('z').value=value(p.z);
    el('rx').value=deg(r.x);el('ry').value=deg(r.y);el('rz').value=deg(r.z);
    if(announce)el('detail').textContent=selected.meta.label+' · '+selected.meta.dimensions.map(value).join(' × ')+' mm'+(selected.meta.note?' · '+selected.meta.note:'');
    selection.visible=mode!=='view';selection.box.setFromObject(selected.mesh);root.dataset.selected=selected.key;root.dataset.count=String(instances.length);schedule();
  }
  function select(instance,remember=true){selected=instance;updateFields();if(remember)save();}
  function rebuildOptions(){
    el('selected').replaceChildren();
    for(const item of instances){const option=document.createElement('option');option.value=item.id;option.textContent=item.meta.label+(instances.filter(i=>i.key===item.key).length>1?' · '+item.id.split('-').pop():'');el('selected').append(option);}
  }
  function floorClamp(item,flush=false){item.mesh.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(item.mesh);if(flush||box.min.z<0)item.mesh.position.z-=box.min.z;}
  function add(key,state=null,remember=true){
    const record=geometries.get(key);if(!record||instances.length>=LIMIT)return;
    const holder=record.meta.kind==='holder';const mesh=new THREE.Mesh(record.geometry,[holder?bodyMat:relicMat,artworkMat]);mesh.castShadow=true;mesh.receiveShadow=true;mesh.rotation.order='XYZ';
    const item={id:state?.id||'piece-'+(++serial),key,meta:record.meta,mesh};mesh.userData.instance=item;
    if(state){mesh.position.fromArray(state.position);mesh.rotation.set(...state.rotation,'XYZ');}
    else if(instances.length){
      const existing=instances.map(i=>new THREE.Box3().setFromObject(i.mesh));
      let placed=false;
      for(const y of [0,280,-280,560,-560,840,-840,1120,-1120,1400,-1400,1680,-1680]){
        for(const x of [0,280,-280,560,-560,840,-840,1120,-1120,1400,-1400,1680,-1680]){
          const hx=record.meta.dimensions[0]/2+12,hy=record.meta.dimensions[1]/2+12;
          if(existing.every(b=>x+hx<b.min.x||x-hx>b.max.x||y+hy<b.min.y||y-hy>b.max.y)){mesh.position.set(x,y,0);placed=true;break;}
        }
        if(placed)break;
      }
    }
    scene.add(mesh);instances.push(item);floorClamp(item);rebuildOptions();select(item,false);
    if(remember){frame(instances);save();}
    return item;
  }
  function arrange(remember=true){
    if(!instances.length)return;
    const cols=Math.ceil(Math.sqrt(instances.length)),rows=Math.ceil(instances.length/cols);
    const boxes=instances.map(i=>new THREE.Box3().setFromObject(i.mesh));
    const widths=Array(cols).fill(0),depths=Array(rows).fill(0);
    boxes.forEach((b,i)=>{widths[i%cols]=Math.max(widths[i%cols],b.max.x-b.min.x);depths[Math.floor(i/cols)]=Math.max(depths[Math.floor(i/cols)],b.max.y-b.min.y);});
    const totalX=widths.reduce((a,b)=>a+b,0)+25*(cols-1),totalY=depths.reduce((a,b)=>a+b,0)+25*(rows-1);
    instances.forEach((item,i)=>{const b=boxes[i],c=b.getCenter(new THREE.Vector3()),col=i%cols,row=Math.floor(i/cols);const x=-totalX/2+widths.slice(0,col).reduce((a,b)=>a+b,0)+col*25+widths[col]/2;const y=-totalY/2+depths.slice(0,row).reduce((a,b)=>a+b,0)+row*25+depths[row]/2;item.mesh.position.x+=x-c.x;item.mesh.position.y+=y-c.y;floorClamp(item,true);});
    updateFields();frame(instances);if(remember)save();
  }
  function frame(items){
    if(!items.length)return;const box=new THREE.Box3();for(const i of items)box.expandByObject(i.mesh);
    const center=box.getCenter(new THREE.Vector3()),direction=camera.position.clone().sub(orbit.target).normalize();
    camera.position.copy(center).addScaledVector(direction,100);camera.lookAt(center);
    const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion),up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    const tanY=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),tanX=tanY*camera.aspect;let distance=35;
    for(const item of items){const bounds=new THREE.Box3().setFromObject(item.mesh);
    for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]){
      const v=new THREE.Vector3(x,y,z).sub(center),near=v.dot(direction);
      distance=Math.max(distance,near+Math.abs(v.dot(right))*1.13/tanX,near+Math.abs(v.dot(up))*1.13/tanY);
    }}
    orbit.target.copy(center);camera.position.copy(center).addScaledVector(direction,distance);orbit.update();schedule();
  }
  function changeMode(next,remember=true){
    mode=['view','place','rotate'].includes(next)?next:'view';root.dataset.mode=mode;
    for(const b of root.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));
    el('gesture').textContent=mode==='view'?'Drag to orbit · wheel or pinch to zoom · grid 25 mm':mode==='place'?'Drag a piece across the table · exact height below':'Drag a piece to turn and tilt · exact angles below';
    updateFields(false);if(remember)save();
  }
  function ray(event){const r=canvas.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);}
  function pick(event){ray(event);return raycaster.intersectObjects(instances.map(i=>i.mesh),false)[0]?.object.userData.instance||null;}
  canvas.addEventListener('pointerdown',e=>{
    clickStart={x:e.clientX,y:e.clientY};if(e.button!==0)return;
    const hit=pick(e);if(!hit||mode==='view')return;
    e.stopImmediatePropagation();select(hit,false);orbit.enabled=false;canvas.setPointerCapture(e.pointerId);
    const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-hit.mesh.position.z);
    const start=raycaster.ray.intersectPlane(plane,new THREE.Vector3());
    drag={id:e.pointerId,item:hit,plane,start,position:hit.mesh.position.clone(),rotation:hit.mesh.rotation.clone(),x:e.clientX,y:e.clientY};
  },true);
  canvas.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;e.stopImmediatePropagation();
    if(mode==='place'&&drag.start){ray(e);const hit=raycaster.ray.intersectPlane(drag.plane,new THREE.Vector3());if(hit){drag.item.mesh.position.copy(drag.position).add(hit.sub(drag.start));drag.item.mesh.position.x=THREE.MathUtils.clamp(drag.item.mesh.position.x,-2000,2000);drag.item.mesh.position.y=THREE.MathUtils.clamp(drag.item.mesh.position.y,-2000,2000);}}
    if(mode==='rotate'){drag.item.mesh.rotation.z=drag.rotation.z+(e.clientX-drag.x)*.012;drag.item.mesh.rotation.x=drag.rotation.x+(e.clientY-drag.y)*.012;floorClamp(drag.item);}
    updateFields(false);schedule();
  },true);
  function pointerEnd(e){
    if(drag){if(e.pointerId!==drag.id)return;e.stopImmediatePropagation();drag=null;orbit.enabled=true;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);updateFields();save();}
    else if(clickStart&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)<5){const item=pick(e);if(item)select(item);}
    clickStart=null;
  }
  canvas.addEventListener('pointerup',pointerEnd,true);canvas.addEventListener('pointercancel',pointerEnd,true);
  canvas.addEventListener('dblclick',e=>{const item=pick(e);if(item){select(item);frame([item]);save();}});
  orbit.addEventListener('change',schedule);orbit.addEventListener('end',save);
  for(const b of root.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>changeMode(b.dataset.mode));
  el('add').addEventListener('click',()=>add(el('library').value));
  el('library').addEventListener('change',()=>{const item=instances.find(i=>i.key===el('library').value);if(item){select(item);frame([item]);save();}});
  el('grid').addEventListener('click',()=>arrange());el('all').addEventListener('click',()=>{frame(instances);save();});
  el('add-related').addEventListener('click',()=>{const key=el('related').value,existing=instances.find(i=>i.key===key);if(existing){const previous=selected;select(existing);frame([previous,existing].filter(Boolean));save();}else add(key);});
  el('selected').addEventListener('change',()=>select(instances.find(i=>i.id===el('selected').value)));
  el('inspect').addEventListener('click',()=>{if(selected){frame([selected]);save();}});
  el('flip').addEventListener('click',()=>{if(selected){selected.mesh.rotation.y+=Math.PI;floorClamp(selected,true);updateFields();frame([selected]);save();}});
  el('table').addEventListener('click',()=>{if(selected){floorClamp(selected,true);updateFields();save();}});
  el('remove').addEventListener('click',()=>{
    if(!selected)return;scene.remove(selected.mesh);instances.splice(instances.indexOf(selected),1);rebuildOptions();select(instances.at(-1)||null,false);root.dataset.count=String(instances.length);save();schedule();
  });
  for(const id of ['x','y','z','rx','ry','rz'])el(id).addEventListener('change',()=>{
    if(!selected)return;const n=Number(el(id).value);if(!Number.isFinite(n)){updateFields();return;}
    if(id.length===1)selected.mesh.position[id]=THREE.MathUtils.clamp(n,id==='z'?0:-2000,2000);
    else selected.mesh.rotation[id[1]]=THREE.MathUtils.degToRad(THREE.MathUtils.clamp(n,-360,360));
    floorClamp(selected);updateFields();save();
  });
  el('placement').querySelector('summary').addEventListener('click',()=>setTimeout(save,0));
  el('file').addEventListener('change',async()=>{
    const status=el('import-status');
    for(const file of el('file').files){
      try{
        if(instances.length>=LIMIT)throw Error('The table holds up to 64 pieces.');
        if(file.size>200*1024*1024)throw Error('Use a model smaller than 200 MB.');
        status.textContent='Opening '+file.name+'…';
        const ext=file.name.split('.').pop().toLowerCase(),buffer=await file.arrayBuffer();let geometry;
        if(ext==='stl'){
          const {STLLoader}=await import('https://esm.sh/three@0.170.0/examples/jsm/loaders/STLLoader.js');
          geometry=new STLLoader().parse(buffer);
        }else{
          let object;
          if(ext==='obj'){
            const {OBJLoader}=await import('https://esm.sh/three@0.170.0/examples/jsm/loaders/OBJLoader.js');
            object=new OBJLoader().parse(new TextDecoder().decode(buffer));
          }else if(ext==='glb'){
            const {GLTFLoader}=await import('https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js');
            object=(await new Promise((resolve,reject)=>new GLTFLoader().parse(buffer,'',resolve,reject))).scene;
            object.scale.multiplyScalar(1000);
          }else throw Error('Choose STL, OBJ, or a self-contained GLB.');
          object.updateMatrixWorld(true);const parts=[];
          object.traverse(node=>{if(node.isMesh){let g=node.geometry.clone().applyMatrix4(node.matrixWorld);if(g.index)g=g.toNonIndexed();for(const name of Object.keys(g.attributes))if(name!=='position')g.deleteAttribute(name);g.clearGroups();parts.push(g);}});
          if(!parts.length)throw Error('No static mesh found.');
          const {mergeGeometries}=await import('https://esm.sh/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js');geometry=mergeGeometries(parts,false);
        }
        if(!geometry?.getAttribute('position')?.count)throw Error('No mesh vertices found.');
        geometry.computeBoundingBox();const b=geometry.boundingBox,d=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
        if(![...d.toArray(),...c.toArray()].every(Number.isFinite)||d.length()===0)throw Error('Invalid model bounds.');
        geometry.translate(-c.x,-c.y,-b.min.z);geometry=toCreasedNormals(geometry,Math.PI/5);geometry.computeBoundingBox();geometry.computeBoundingSphere();
        const key='local-'+Date.now()+'-'+serial,meta={key,label:file.name,kind:'relic',dimensions:d.toArray(),related:[],imported:true,note:'Local static mesh · geometry only; re-open file after reload'};
        geometries.set(key,{meta,geometry});const group=document.createElement('option');group.value=key;group.textContent=file.name;el('library').append(group);
        const item=add(key);frame([item]);status.textContent=file.name+' opened locally. '+(ext==='glb'?'Meters converted to mm.':'Units assumed mm.');
      }catch(e){status.textContent=file.name+': '+e.message;}
    }
    el('file').value='';
  });
  function validState(state){return !config.embed&&state?.modelContent?.version===2&&Array.isArray(state.modelContent.models)&&state.modelContent.models.length<=LIMIT;}
  function restore(state){
    if(!validState(state))return false;
    for(const i of instances)scene.remove(i.mesh);instances.length=0;selected=null;serial=0;
    for(const row of state.modelContent.models){
      if(!geometries.has(row.key)||!Array.isArray(row.position)||!Array.isArray(row.rotation)||row.position.length!==3||row.rotation.length!==3||![...row.position,...row.rotation].every(Number.isFinite))continue;
      const item=add(row.key,{id:'piece-'+(++serial),position:row.position.map((v,i)=>THREE.MathUtils.clamp(v,i===2?0:-2000,2000)),rotation:row.rotation},false);
      item.savedId=row.id;
    }
    const ui=state.privateContent||{};
    select(instances.find(i=>i.savedId===state.modelContent.selectedId)||instances[0]||null,false);changeMode(ui.mode,false);
    if(Array.isArray(ui.camera)&&Array.isArray(ui.target)&&ui.camera.length===3&&ui.target.length===3&&[...ui.camera,...ui.target].every(Number.isFinite)){camera.position.fromArray(ui.camera);orbit.target.fromArray(ui.target);orbit.update();}else frame(instances);
    el('placement').open=!!ui.placementOpen;return true;
  }
  resize();updateTheme();
  if(!restore(window.openai?.widgetState)){for(const model of library)add(model.key,null,false);arrange(false);select(instances.find(i=>i.key==='gorget')||instances[0],false);changeMode('view',false);}
  window.addEventListener('openai:set_globals',event=>{
    const state=event.detail?.globals?.widgetState;
    if(state&&!drag&&JSON.stringify(state)!==lastSaved){const wasReady=ready;ready=false;restore(state);ready=wasReady;schedule();}
    updateTheme();
  });
  el('loading').hidden=true;el('add').disabled=false;ready=true;root.dataset.ready='true';root.dataset.library=String(library.length);schedule();
} catch(e){
  el('loading').hidden=true;error.hidden=false;error.textContent='The 3D view could not load. '+e.message;root.dataset.ready='error';console.error(e);
}
</script>
