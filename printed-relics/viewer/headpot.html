<script type="module">
const root=document.getElementById('bbr-complete-library');
const el=id=>document.getElementById('bbr-'+id);
const error=el('error');
const config=JSON.parse(el('config').textContent),LIMIT=64;
if(config.embed){root.dataset.embed='true';root.querySelectorAll('.viz-controls,.bbr-modes,details,.bbr-detail').forEach(x=>x.hidden=true);}
else el('import-controls').hidden=!config.imports;
try {
  const THREE=await import('https://esm.sh/three@0.170.0');
  const {OrbitControls}=await import('https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js');
  const {toCreasedNormals}=await import('https://esm.sh/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js');
  const library=JSON.parse(document.getElementById('bbr-model-data').textContent);
  const geometries=new Map();
  for(const m of library){
    const packed=Uint8Array.from(atob(m.packed),c=>c.charCodeAt(0));
    const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const raw=await new Response(stream).arrayBuffer();
    const bytes=new Uint8Array(raw);let cursor=0;
