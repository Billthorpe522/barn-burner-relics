<script type="application/json" id="bbr-config">{"embed":true,"imports":false}</script>
<script type="module">
const root=document.getElementById('bbr-complete-library');
const el=id=>document.getElementById('bbr-'+id);
const error=el('error');
const config=JSON.parse(el('config').textContent),LIMIT=64;
if(config.embed){root.dataset.embed='true';root.querySelectorAll('.viz-controls,.bbr-modes,details,.bbr-detail').forEach(x=>x.hidden=true);}
else el('import-controls').hidden=!config.imports;
try {
  const THREE=await import('https://esm.sh/three@0.170.0');
  const {OrbitControls}=await import('https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js');
  const {toCreasedNormals}=await import('https://esm.sh/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js');
  const library=JSON.parse(document.getElementById('bbr-model-data').textContent);
  const geometries=new Map();
  for(const m of library){
    const packed=Uint8Array.from(atob(m.packed),c=>c.charCodeAt(0));
    const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const raw=await new Response(stream).arrayBuffer();
    const bytes=new Uint8Array(raw);let cursor=0;
    function signed(){let n=0,s=0,b;do{b=bytes[cursor++];n|=(b&127)<<s;s+=7;}while(b&128);return (n>>>1)^-(n&1);}
    const vertices=new Float32Array(m.nv*3);
    const accum=[0,0,0];for(let i=0;i<vertices.length;i++){const d=i%3;accum[d]+=signed();vertices[i]=m.min[d]+accum[d]*(m.max[d]-m.min[d])/65535;}
    const indices=new Uint32Array(m.nf*3);let first=0;
    for(let i=0;i<indices.length;i+=3){first+=signed();indices[i]=first;indices[i+1]=first+signed();indices[i+2]=first+signed();}
    if(cursor!==bytes.length)throw Error('Geometry payload length mismatch: '+m.key);
    let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(vertices,3));g.setIndex(new THREE.BufferAttribute(indices,1));
    g.addGroup(0,indices.length,0);
    g=toCreasedNormals(g,Math.PI/5);g.computeBoundingBox();g.computeBoundingSphere();
    geometries.set(m.key,{meta:m,geometry:g});
  }
  for(const [kind,title] of [['relic','Relics'],['holder','Stands and cradles'],['reference','Form studies'],['accessory','Tools']]){
    const group=document.createElement('optgroup');group.label=title;
    for(const m of library.filter(x=>x.kind===kind)){const o=document.createElement('option');o.value=m.key;o.textContent=m.label;group.append(o);}
    el('library').append(group);
  }
  const canvas=el('canvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,.1,50000);camera.up.set(0,0,1);camera.position.set(210,-300,360);
  const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=false;orbit.minDistance=12;orbit.maxDistance=12000;
  orbit.enablePan=true;orbit.screenSpacePanning=true;
  const bodyMat=new THREE.MeshStandardMaterial({roughness:.53,metalness:.05});
  const artworkMat=new THREE.MeshStandardMaterial({roughness:.42,metalness:.35});
  const relicMat=new THREE.MeshStandardMaterial({roughness:.6,metalness:0});
  const ambient=new THREE.HemisphereLight();ambient.intensity=1.1;scene.add(ambient);

  const instances=[];let selected=null,mode='view',serial=0,drag=null,clickStart=null,ready=false,lastSaved='';
  const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
  const stage=root.querySelector('.bbr-stage');let framePending=false;

  const cssProbe=document.createElement('span');cssProbe.hidden=true;root.append(cssProbe);
  const paletteCanvas=document.createElement('canvas');paletteCanvas.width=paletteCanvas.height=1;const paletteCtx=paletteCanvas.getContext('2d');
  function themeColor(token){cssProbe.style.color='var(--'+token+')';paletteCtx.fillStyle=getComputedStyle(cssProbe).color;paletteCtx.fillRect(0,0,1,1);const p=paletteCtx.getImageData(0,0,1,1).data;return new THREE.Color().setRGB(p[0]/255,p[1]/255,p[2]/255,THREE.SRGBColorSpace);}

  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',updateTheme);
  function deg(v){return Math.round(THREE.MathUtils.radToDeg(v)*10)/10;}
  function value(v){return Math.round(v*10)/10;}
  function save(){

    lastSaved=JSON.stringify(state);window.openai.setWidgetState(state).catch(()=>{});
  }
  function updateFields(announce=true){

    root.dataset.count=String(instances.length);el('add').disabled=instances.length>=LIMIT;
    el('related-controls').hidden=config.embed||!selected?.meta.related?.length;

    el('related').replaceChildren();for(const key of selected.meta.related||[]){const o=document.createElement('option');o.value=key;o.textContent=geometries.get(key).meta.label;el('related').append(o);}

    el('x').value=value(p.x);el('y').value=value(p.y);el('z').value=value(p.z);

    if(announce)el('detail').textContent=selected.meta.label+' · '+selected.meta.dimensions.map(value).join(' × ')+' mm'+(selected.meta.note?' · '+selected.meta.note:'');

  }
  function select(instance,remember=true){selected=instance;updateFields();if(remember)save();}
  function rebuildOptions(){

    for(const item of instances){const option=document.createElement('option');option.value=item.id;option.textContent=item.meta.label+(instances.filter(i=>i.key===item.key).length>1?' · '+item.id.split('-').pop():'');el('selected').append(option);}
  }
  function floorClamp(item,flush=false){item.mesh.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(item.mesh);if(flush||box.min.z<0)item.mesh.position.z-=box.min.z;}
  function add(key,state=null,remember=true){

  }
  function arrange(remember=true){

    boxes.forEach((b,i)=>{widths[i%cols]=Math.max(widths[i%cols],b.max.x-b.min.x);depths[Math.floor(i/cols)]=Math.max(depths[Math.floor(i/cols)],b.max.y-b.min.y);});

  }
  function frame(items){
    if(!items.length)return;const box=new THREE.Box3();for(const i of items)box.expandByObject(i.mesh);
    const center=box.getCenter(new THREE.Vector3()),direction=camera.position.clone().sub(orbit.target).normalize();

  function changeMode(next,remember=true){

  orbit.addEventListener('change',schedule);orbit.addEventListener('end',save);
  for(const b of root.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>changeMode(b.dataset.mode));
  el('add').addEventListener('click',()=>add(el('library').value));
  el('library').addEventListener('change',()=>{const item=instances.find(i=>i.key===el('library').value);if(item){select(item);frame([item]);save();}});

  el('file').addEventListener('change',async()=>{
    const status=el('import-status');

      try{
        if(instances.length>=LIMIT)throw Error('The table holds up to 64 pieces.');

      }catch(e){status.textContent=file.name+': '+e.message;}
    }
    el('file').value='';
  });
  function validState(state){return !config.embed&&state?.modelContent?.version===2&&Array.isArray(state.modelContent.models)&&state.modelContent.models.length<=LIMIT;}
  function restore(state){

}
